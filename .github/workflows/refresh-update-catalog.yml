name: Refresh Pi update metadata

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: y-scores-release-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    environment: pi-catalog
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-release.txt
      - name: Renew expiry without rebuilding application releases
        shell: bash
        env:
          TUF_TARGETS_KEY_PEM: ${{ secrets.TUF_TARGETS_KEY_PEM }}
          TUF_SNAPSHOT_KEY_PEM: ${{ secrets.TUF_SNAPSHOT_KEY_PEM }}
          TUF_TIMESTAMP_KEY_PEM: ${{ secrets.TUF_TIMESTAMP_KEY_PEM }}
        run: |
          set -euo pipefail
          test -r update-trust/root.json
          gh auth setup-git
          catalog="$RUNNER_TEMP/catalog"
          git clone --depth=1 --branch updates-catalog "https://github.com/$GITHUB_REPOSITORY.git" "$catalog"
          python scripts/publish_update_metadata.py --metadata-dir "$catalog/metadata" --root update-trust/root.json
          git -C "$catalog" config user.name 'github-actions[bot]'
          git -C "$catalog" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$catalog" add metadata
          git -C "$catalog" commit -m 'Refresh signed Pi update catalog expiry'
          git -C "$catalog" push origin HEAD:updates-catalog
